# This is a template.
# Jenkins will generate the real inventory.ini using Terraform output.

[webservers]
YOUR_SERVER_IP ansible_user=ec2-user ansible_ssh_private_key_file=/var/lib/jenkins/.ssh/royal-hotel-dev-key.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[webservers:vars]
ansible_python_interpreter=/usr/bin/python3
