---
- name: Configure and Deploy Royal Hotel Application Server
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    app_name: royal-hotel
    app_user: ec2-user
    app_group: ec2-user
    app_base_dir: /opt/royal-hotel
    app_repo_url: "https://github.com/amankainth/hotel_management_health.git"
    app_repo_branch: main
    app_dir: /opt/royal-hotel/app
    app_service_name: royal-hotel
    app_port: 8080
    java_package: java-17-amazon-corretto-devel

  pre_tasks:
    - name: Display target server information
      debug:
        msg:
          - "Target Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Architecture: {{ ansible_architecture }}"
          - "Application: {{ app_name }}"
          - "Repository: {{ app_repo_url }}"

  tasks:
    # ============================================================
    # OS Update
    # ============================================================

    - name: Update all OS packages
      dnf:
        name: "*"
        state: latest
        update_cache: yes

    # ============================================================
    # Install Required Packages
    # ============================================================

    - name: Install Java 21, Maven, Git and required tools
      dnf:
        name:
          - java-17-amazon-corretto-devel
          - maven
          - git
          - wget
          - unzip
          - tar
        state: present

    - name: Verify Java version
      command: java -version
      register: java_version
      changed_when: false

    - name: Show Java version
      debug:
        var: java_version.stderr_lines

    - name: Verify Maven version
      command: mvn -version
      register: maven_version
      changed_when: false

    - name: Show Maven version
      debug:
        var: maven_version.stdout_lines

    - name: Verify Git version
      command: git --version
      register: git_version
      changed_when: false

    - name: Show Git version
      debug:
        var: git_version.stdout

    # ============================================================
    # Prepare Application Directory
    # ============================================================

    - name: Create application base directory
      file:
        path: "{{ app_base_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Create application logs directory
      file:
        path: /var/log/royal-hotel
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    # ============================================================
    # Stop Existing Service Before Deployment
    # ============================================================

    - name: Stop existing Royal Hotel service if running
      systemd:
        name: "{{ app_service_name }}"
        state: stopped
      ignore_errors: yes

    # ============================================================
    # Clone Application Repository
    # ============================================================

    - name: Clone Royal Hotel application repository
      git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ app_repo_branch }}"
        force: yes
      become_user: "{{ app_user }}"

    # ============================================================
    # Build Application
    # ============================================================

    - name: Build Java application with Maven
      command: mvn clean package -DskipTests
      args:
        chdir: "{{ app_dir }}"
      become_user: "{{ app_user }}"
      register: maven_build

    - name: Show Maven build output
      debug:
        var: maven_build.stdout_lines

    # ============================================================
    # Locate JAR File
    # ============================================================

    - name: Locate packaged application JAR file
      find:
        paths: "{{ app_dir }}/target"
        patterns: "*.jar"
        file_type: file
      register: jar_files

    - name: Fail if no JAR file was created
      fail:
        msg: "No JAR file found under {{ app_dir }}/target. Maven build may have failed."
      when: jar_files.files | length == 0

    - name: Set application JAR path
      set_fact:
        app_jar_path: "{{ jar_files.files | map(attribute='path') | list | first }}"

    - name: Display selected JAR file
      debug:
        msg: "Using JAR file: {{ app_jar_path }}"

    # ============================================================
    # Create Systemd Service
    # ============================================================

    - name: Create systemd service for Royal Hotel application
      copy:
        dest: "/etc/systemd/system/{{ app_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Royal Hotel Java Application
          After=network.target

          [Service]
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/java -jar {{ app_jar_path }}
          SuccessExitStatus=143
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/royal-hotel/application.log
          StandardError=append:/var/log/royal-hotel/application-error.log

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Royal Hotel application service
      systemd:
        name: "{{ app_service_name }}"
        state: restarted
        enabled: yes

    # ============================================================
    # Verification
    # ============================================================

    - name: Wait for application port to become available
      wait_for:
        host: localhost
        port: "{{ app_port }}"
        timeout: 120
        delay: 10

    - name: Check Royal Hotel service status
      command: systemctl status "{{ app_service_name }}" --no-pager
      register: service_status
      changed_when: false
      ignore_errors: yes

    - name: Show service status
      debug:
        var: service_status.stdout_lines

    - name: Verify application responds on localhost
      uri:
        url: "http://localhost:{{ app_port }}"
        method: GET
        status_code:
          - 200
          - 302
          - 401
          - 403
        return_content: no
      register: app_http_check
      ignore_errors: yes

    - name: Display application HTTP check result
      debug:
        msg:
          - "HTTP check completed"
          - "Status: {{ app_http_check.status | default('No status returned') }}"
          - "URL: http://localhost:{{ app_port }}"

    - name: Show recent application logs
      shell: |
        echo "===== application.log ====="
        tail -50 /var/log/royal-hotel/application.log 2>/dev/null || true
        echo ""
        echo "===== application-error.log ====="
        tail -50 /var/log/royal-hotel/application-error.log 2>/dev/null || true
      register: app_logs
      changed_when: false

    - name: Print recent application logs
      debug:
        var: app_logs.stdout_lines

  post_tasks:
    - name: Deployment summary
      debug:
        msg:
          - "✅ Royal Hotel deployment completed."
          - "Application directory: {{ app_dir }}"
          - "JAR file: {{ app_jar_path }}"
          - "Service name: {{ app_service_name }}"
          - "Application port: {{ app_port }}"
          - "Public URL: http://{{ inventory_hostname }}:{{ app_port }}"
