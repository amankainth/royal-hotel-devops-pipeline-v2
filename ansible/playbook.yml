---
- name: Configure and Deploy Royal Hotel Application Server
  hosts: webservers
  become: yes
  gather_facts: yes

  vars:
    app_name: royal-hotel
    app_user: ec2-user
    app_group: ec2-user
    app_base_dir: /opt/royal-hotel
    app_repo_url: "https://github.com/amankainth/hotel_management_health.git"
    app_repo_branch: main
    app_dir: /opt/royal-hotel/app
    app_build_dir: /opt/royal-hotel/app/build
    app_service_name: royal-hotel
    app_port: 8080
    java_package: java-17-amazon-corretto-devel
    main_class: com.example.SimpleWebApp

  pre_tasks:
    - name: Display target server information
      debug:
        msg:
          - "Target Host: {{ inventory_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Application: {{ app_name }}"
          - "Repository: {{ app_repo_url }}"
          - "Main Class: {{ main_class }}"

  tasks:

    # ============================================================
    # OS Update and Package Install
    # ============================================================

    - name: Update all OS packages
      dnf:
        name: "*"
        state: latest
        update_cache: yes

    - name: Install Java 17, Git and required tools
      dnf:
        name:
          - "{{ java_package }}"
          - git
          - wget
          - unzip
          - tar
        state: present

    - name: Verify Java version
      command: java -version
      register: java_version
      changed_when: false

    - name: Show Java version
      debug:
        var: java_version.stderr_lines

    # ============================================================
    # Prepare Directories
    # ============================================================

    - name: Create application base directory
      file:
        path: "{{ app_base_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Create application logs directory
      file:
        path: /var/log/royal-hotel
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    # ============================================================
    # Stop Existing Service
    # ============================================================

    - name: Stop existing Royal Hotel service if running
      systemd:
        name: "{{ app_service_name }}"
        state: stopped
      ignore_errors: yes

    # ============================================================
    # Clone Repository
    # ============================================================

    - name: Clone Royal Hotel application repository
      git:
        repo: "{{ app_repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ app_repo_branch }}"
        force: yes
      become_user: "{{ app_user }}"

    # ============================================================
    # Compile Java Sources
    # ============================================================

    - name: Create build output directory
      file:
        path: "{{ app_build_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_group }}"
        mode: "0755"

    - name: Find all Java source files
      find:
        paths: "{{ app_dir }}/src"
        patterns: "*.java"
        recurse: yes
      register: java_files

    - name: Fail if no Java source files found
      fail:
        msg: "No Java source files found under {{ app_dir }}/src"
      when: java_files.files | length == 0

    - name: Show found Java files
      debug:
        msg: "Found {{ java_files.files | length }} Java source file(s)"

    - name: Compile Java sources with javac
      shell: |
        cd {{ app_dir }}
        javac -d {{ app_build_dir }} $(find src -name "*.java")
      become_user: "{{ app_user }}"
      register: javac_build

    - name: Show compile output
      debug:
        msg: "Compilation successful"
      when: javac_build.rc == 0

    - name: List compiled classes
      shell: find {{ app_build_dir }} -name "*.class"
      register: class_files
      changed_when: false

    - name: Show compiled classes
      debug:
        var: class_files.stdout_lines

    - name: Verify main class exists
      stat:
        path: "{{ app_build_dir }}/{{ main_class | replace('.', '/') }}.class"
      register: main_class_check

    - name: Fail if main class not found
      fail:
        msg: "Main class {{ main_class }}.class not found under {{ app_build_dir }}"
      when: not main_class_check.stat.exists

    # ============================================================
    # Systemd Service
    # ============================================================

    - name: Create systemd service for Royal Hotel application
      copy:
        dest: "/etc/systemd/system/{{ app_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Royal Hotel Java Application
          After=network.target

          [Service]
          Type=simple
          User={{ app_user }}
          Group={{ app_group }}
          WorkingDirectory={{ app_dir }}
          ExecStart=/usr/bin/java -cp {{ app_build_dir }} {{ main_class }}
          SuccessExitStatus=143
          Restart=always
          RestartSec=10
          StandardOutput=append:/var/log/royal-hotel/application.log
          StandardError=append:/var/log/royal-hotel/application-error.log

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes

    - name: Enable and start Royal Hotel application service
      systemd:
        name: "{{ app_service_name }}"
        state: restarted
        enabled: yes

    # ============================================================
    # Verification
    # ============================================================

    - name: Wait for application port to become available
      wait_for:
        host: localhost
        port: "{{ app_port }}"
        timeout: 60
        delay: 5

    - name: Check service status
      command: systemctl status "{{ app_service_name }}" --no-pager
      register: service_status
      changed_when: false
      ignore_errors: yes

    - name: Show service status
      debug:
        var: service_status.stdout_lines

    - name: Verify application responds on localhost
      uri:
        url: "http://localhost:{{ app_port }}"
        method: GET
        status_code:
          - 200
          - 302
          - 401
          - 403
        return_content: no
      register: app_http_check
      ignore_errors: yes

    - name: Show HTTP check result
      debug:
        msg:
          - "HTTP status: {{ app_http_check.status | default('N/A') }}"
          - "URL: http://localhost:{{ app_port }}"

    - name: Show recent application logs
      shell: |
        echo "===== application.log ====="
        tail -30 /var/log/royal-hotel/application.log 2>/dev/null || true
        echo ""
        echo "===== application-error.log ====="
        tail -30 /var/log/royal-hotel/application-error.log 2>/dev/null || true
      register: app_logs
      changed_when: false

    - name: Print application logs
      debug:
        var: app_logs.stdout_lines

  post_tasks:
    - name: Deployment summary
      debug:
        msg:
          - "Royal Hotel deployment completed."
          - "Main class: {{ main_class }}"
          - "Application port: {{ app_port }}"
          - "Public URL: http://{{ inventory_hostname }}:{{ app_port }}"
